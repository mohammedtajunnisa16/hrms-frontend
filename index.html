
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="whole-login">
        <div class="login">
            <img src="images/logo.jpeg" alt="HRMS Logo">
            <h1>Manage Your Workforce<br>Smarter</h1>
            <h3>All-in-one solution to streamline employee<br>management, attendance, payroll and more.</h3>
        </div>
        <div class="login-form">
            <h1>Welcome Back!</h1>
            <p>Please sign in to your account</p>
            <div class="input-box">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="Enter your email">
            </div>
            <div class="input-box">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password">
            </div>
            <div class="input-box2">
                <input id="remember" type="checkbox">
                <label for="remember">Remember me</label>
                <h3>Forgot Password?</h3>
            </div>
            <a class="btn4" href="Modules/Dashboard/Overview.html">Sign in</a>
            <p class="log">or continue with</p>
            <div class="google">
                <div class="gog">
                    <a href="#"><i class="fa-brands fa-google"></i> Google</a>
                </div>
                <div class="gog">
                    <a href="#"><i class="fa-brands fa-microsoft"></i> Microsoft</a>
                </div>
            </div>
            <p class="gogg">Don't have an account? <span>Sign up</span></p>
        </div>
    </div>
</body>
</html>
